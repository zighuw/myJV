name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS and Linux)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: ASan and UBSan (Linux, Clang)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-Linux-clang-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --config RelWithDebInfo --target myJV_tests

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  pluginval:
    name: pluginval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target myJV_VST3

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          mkdir -p pluginval-logs

      - name: Run pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pluginval = Get-ChildItem -Path pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pluginval.FullName --strictness-level 5 --skip-gui-tests --output-dir pluginval-logs --validate "build/myJV_artefacts/Release/VST3/myJV.vst3"

      - name: Run pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          PLUGINVAL=$(find pluginval -name pluginval -type f -perm -u+x | head -n 1)
          "$PLUGINVAL" --strictness-level 5 --skip-gui-tests --output-dir pluginval-logs --validate "build/myJV_artefacts/Release/VST3/myJV.vst3"

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ runner.os }}
          path: pluginval-logs
          if-no-files-found: ignore
